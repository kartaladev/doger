version: "2"
run:
  # lint with the language version of the go directive
  go: "1.27"
  concurrency: 4
  # also lint _test.go files
  tests: true
  timeout: 5m
linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - gocritic
    - gocyclo
    - revive
    - ineffassign
    - unconvert
    - goconst
    # - depguard
    - prealloc
    # - dupl
    - misspell
    - bodyclose
    - sqlclosecheck
    - nilerr
    - nestif
    - forcetypeassert
    - exhaustive
    - funlen
    # - wsl_v5
    - testifylint
    - modernize
    # security issues; each finding is fixed or suppressed inline with its reason
    - gosec
    # error comparisons and type switches that miss wrapped errors
    - errorlint
    # HTTP requests built without a context
    - noctx

  # disable noisy/controversial ones which you might enable later
  disable:
    - lll          # line length — handled by gfmt/gofumpt

  settings:
    dupl:
      threshold: 20  # lower => stricter (tokens)
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15 # strict; lower => stricter
    modernize:
      disable:
        # its fixes change test fixture field types (int32 -> atomic.Int32)
        # and rewrite assertion expressions: not a mechanical rewrite, and
        # it only affects tests
        - atomictypes
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    testifylint:
      disable:
        - require-error
        - float-compare

  exclusions:
    generated: lax
    # make lint-all lints each example module from its own directory, where
    # this path never matches: it only spares the examples when the root
    # module is linted from the repository root
    paths:
      - examples$
    rules:
      # providers and hooks take parameters fixed by their function types,
      # which many implementations do not use
      - linters:
          - revive
        text: "^unused-parameter:"
      # closing a response body has nothing actionable to report
      - linters:
          - errcheck
        text: "Error return value of `.*\\.Body\\.Close` is not checked"
      # linters disabled in tests: repeated literals, long table-driven
      # functions, ignored errors of setup calls and asserted type
      # conversions are the norm there and are checked by the assertions
      - linters:
          - dupl
          - goconst
          - funlen
          - errcheck
          - forcetypeassert
          - revive
        path: "_test\\.go$"
      # the tests package holds black-box scenario tests, not API
      - linters:
          - revive
        path: "tests/"



issues:
  max-issues-per-linter: 0  # 0 = unlimited (we want ALL issues)
  max-same-issues: 100


formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
