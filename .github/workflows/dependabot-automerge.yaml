name: Dependabot automerge

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    # the pull request's author, not the actor of this run: a human pushing
    # to a Dependabot branch does not make the pull request Dependabot's
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # semver-major updates wait for a human review; branch protection's
      # required checks still gate the merge
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
