name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # built with Go 1.27; bump together with Go releases and keep equal
          # to GOLANGCI_LINT_VERSION in the Makefile (checked by
          # scripts/check-workflows.sh)
          version: v2.15.0
          install-only: true

      # every go.work module, with the repository's .golangci.yml
      - name: golangci-lint
        run: make lint-all
