name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
  push:
    paths:
      - 'docs/**'
  workflow_dispatch:

# one Pages deployment at a time; never cancel one that is in progress
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Install dependencies
        run: npm ci

      - name: Lint (formatting + Go code block validation)
        run: npm run lint

      - name: Build Docusaurus project
        run: npm run build

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  # publishes https://kartaladev.github.io/doger/ (docusaurus.config.ts url + baseUrl)
  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'kartaladev/doger'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
